name: Dev Binary Publish

on:
  push:
    branches:
      - personal-development
    paths:
      - 'Makefile'
      - '.github/workflows/**/*'
      - 'cmd/**/*'
      - 'internal/**/*'
      - 'pkg/**/*'
      - 'go.mod'
      - 'go.sum'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_NAME: templar

jobs:
  build-dev-binary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod tidy

      - name: Compile binaries
        run: |
          mkdir -p dist

          # Build for Linux amd64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X main.version=development -X main.commit=${{ github.sha }}" \
            -o "dist/${{ env.PROJECT_NAME }}-dev-linux-amd64" ./cmd/...

          # Build for Linux arm64
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X main.version=development -X main.commit=${{ github.sha }}" \
            -o "dist/${{ env.PROJECT_NAME }}-dev-linux-arm64" ./cmd/...

      - name: Upload dev binaries as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT_NAME }}-dev-binaries
          path: dist/*
          retention-days: 7
