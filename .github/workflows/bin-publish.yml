name: Binary Publish

on:
  push:
    branches:
      - '*.*.*-rc*'
    tags:
      - '*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_NAME: templar

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases and upload release assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: go.sum

      - name: Prepare release version and metadata
        id: prep
        run: |
          TAG_NAME=${GITHUB_REF_NAME}
          CLEAN_TAG=${TAG_NAME#v}

          # Check if the ref corresponds to a Release Candidate (-rc)
          if [[ "$CLEAN_TAG" =~ -rc[0-9]+$ ]]; then
            echo "⚡ RC build detected"
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Release build detected"
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

          echo "VERSION=$CLEAN_TAG" >> $GITHUB_ENV

      - name: Download dependencies
        run: go mod tidy

      - name: Compile binaries
        run: |
          mkdir -p dist

          # Build for Linux amd64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X main.version=${{ env.VERSION }}" \
            -o "dist/${{ env.PROJECT_NAME }}-linux-amd64" ./cmd/...

          # Build for Linux arm64
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X main.version=${{ env.VERSION }}" \
            -o "dist/${{ env.PROJECT_NAME }}-linux-arm64" ./cmd/...

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          tag_name: ${{ github.ref_name }}
          name: Release ${{ env.VERSION }}
          prerelease: ${{ steps.prep.outputs.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
